# Development stack: one Dockerfile.dev, multiple targets, source mounted for live reload.
# Uses the Compose Specification (Compose v2/v5). No top-level "version" needed.
# Refs: https://docs.docker.com/compose/intro/history/
#       https://docs.docker.com/compose/gettingstarted/
#       https://docs.docker.com/compose/how-tos/project-name/
#
# Usage (CLI is "docker compose", not docker-compose):
#   docker compose -f compose.dev.yml up -d
#   docker compose -f compose.dev.yml up -d --build
#   docker compose -f compose.dev.yml up -d --force-recreate --build
#
# Ensure apps/backend/.env, apps/frontend/.env.local, apps/pdf-service/.env exist.
#
# Values below come from the gitignored repo-root .env (compose reads it automatically).
# Copy .env.example to .env and fill it in. Required keys use the ${VAR:?message} form so a
# missing value fails immediately with a readable error instead of starting a broken stack.
# Overrides below use service names for container-to-container networking; browser uses localhost.
#
# Live reload: we use (1) bind mount (.:/app) so the container sees host files, and (2) in-container
# dev servers (nodemon, next dev, tsx watch) that react to changes. Optionally use Compose Watch so
# "docker compose watch" or "docker compose up --watch" is supported (see develop.watch below).
# https://docs.docker.com/compose/gettingstarted/#step-4-edit-the-compose-file-to-use-compose-watch
# https://docs.docker.com/compose/how-tos/file-watch/

name: addinvoice-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in the repo-root .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in the repo-root .env}"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the expansion so the container's shell resolves it, not compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend-dev
    ports:
      - "4000:4000"
      - "51212:51212"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .git/
            - "**/dist/"
            - "**/.next/"
            - .turbo/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
    env_file:
      - apps/backend/.env
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PDF_SERVICE_URL: http://pdf-service:4001
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      pdf-service: { condition: service_started }

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend-dev
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .git/
            - "**/dist/"
            - "**/.next/"
            - .turbo/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
    env_file:
      - apps/frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Server-side calls (route handlers) resolve the backend over the compose
      # network; localhost inside this container is the frontend itself.
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend

  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: pdf-service-dev
    ports:
      - "4001:4001"
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .git/
            - "**/dist/"
            - "**/.next/"
            - .turbo/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
    env_file:
      - apps/pdf-service/.env
    environment:
      PORT: "4001"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      postgres: { condition: service_healthy }

  # Metro bundler for the Expo app. Unlike the frontend, the bundle it serves runs
  # on a physical phone, so every URL here must be the host's LAN address — the
  # phone is not on the Docker network and cannot resolve "backend" or localhost.
  # Refresh LAN_IP after a network change with `pnpm dev:ip`.
  #
  # LAN_IP is deliberately required rather than defaulted: a stale default would
  # start Metro advertising an unreachable address, and the phone just hangs on
  # "connecting to the development server" with nothing in the logs to explain it.
  mobile:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: mobile-dev
    ports:
      - "8081:8081"
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: "${LAN_IP:?run `pnpm dev:ip` to set it in the repo-root .env}"
      EXPO_PUBLIC_API_URL: "http://${LAN_IP:?run `pnpm dev:ip` to set it in the repo-root .env}:4000"
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:?set this in the repo-root .env}"
    # Keeps Expo's CLI happy and its output readable in `docker compose logs`.
    stdin_open: true
    tty: true
    develop:
      watch:
        - action: sync
          path: ./apps/mobile
          target: /app/apps/mobile
          ignore:
            - node_modules/
            - .expo/
        - action: sync
          path: ./packages/schemas/src
          target: /app/packages/schemas/src
        - action: rebuild
          path: apps/mobile/package.json
        - action: rebuild
          path: pnpm-lock.yaml
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: worker-dev
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .git/
            - "**/dist/"
            - "**/.next/"
            - .turbo/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PDF_SERVICE_URL: http://pdf-service:4001
    # No command override: use Dockerfile CMD (pnpm --filter @addinvoice/backend run dev:worker)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      pdf-service: { condition: service_started }

volumes:
  postgres_data_dev:
